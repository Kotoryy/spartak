<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://spartak-api.kotoryy.ru https://raw.githubusercontent.com; manifest-src 'self'">

  <title>Спартак · Матчи</title>
  <meta name="description" content="Ближайшие матчи, результаты, онлайн-счёт и таблица ФК «Спартак» Москва">
  <meta name="theme-color" content="#0d0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Спартак">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png?v=3a38a2f1">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=c6cc809f">
  <script>
    // Тема до отрисовки, чтобы не мигало
    try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('spartak-settings') || '{}').theme || 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=6ae7f400">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <img src="icons/spartak-crest.png?v=85def54b" alt="ФК «Спартак»" class="brand-icon">
      <div>
        <div class="brand-title">Спартак</div>
        <div class="brand-sub">Матчи и результаты</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="refreshBtn" aria-label="Обновить">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Настройки">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <div class="health-note" id="healthNote" hidden></div>
    <section class="day-banner" id="dayBanner" hidden></section>
    <section class="hero" id="hero">
      <div class="hero-skeleton">
        <div class="sk sk-line w40"></div>
        <div class="sk-row"><div class="sk sk-circle"></div><div class="sk sk-line w20"></div><div class="sk sk-circle"></div></div>
        <div class="sk sk-line w60"></div>
      </div>
    </section>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="upcoming" role="tab">Расписание</button>
      <button class="tab" data-tab="results" role="tab">Результаты</button>
      <button class="tab" data-tab="table" role="tab">Таблица</button>
      <button class="tab" data-tab="squad" role="tab">Состав</button>
      <button class="tab" data-tab="news" role="tab">Новости</button>
      <span class="tab-indicator" aria-hidden="true"></span>
    </nav>

    <section class="panel active" id="panel-upcoming"></section>
    <section class="panel" id="panel-results"></section>
    <section class="panel" id="panel-table"></section>
    <section class="panel" id="panel-squad"></section>
    <section class="panel" id="panel-news"></section>

    <footer class="footer">
      <div id="status">Загрузка…</div>
      <div class="muted">Данные: ESPN, Sports.ru · время по вашему часовому поясу</div>
    </footer>
  </main>

  <!-- Нижние панели: карточка матча и настройки -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="sheet-close icon-btn" id="sheetClose" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- Таймер на весь экран в день матча -->
  <div class="big-timer" id="bigTimer" hidden>
    <button class="icon-btn big-close" id="bigClose" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="big-inner" id="bigInner"></div>
  </div>

  <div class="goal-overlay" id="goalOverlay" aria-hidden="true"><div class="goal-text">ГОЛ!</div></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="players.js?v=2f7b58ba"></script>
  <script src="staff.js?v=b598356e"></script>
  <script src="charts.js?v=a2fb8c87"></script>
  <script src="app.js?v=731ae86c"></script>
</body>
</html>
